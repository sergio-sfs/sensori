async function navGo(u,getDest){await permOri();let pos=null;const ar=document.createElement('div');ar.className='arrow';ar.textContent='⬆️';u.el.appendChild(ar);const gid=navigator.geolocation.watchPosition(p=>{pos=p.coords},e=>u.err(e.message),{enableHighAccuracy:true});const h=e=>{const hd=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null),D=getDest();if(!D){u.val({'Stato':'imposta prima la destinazione'});return}if(!pos){u.val({'Stato':'attendo il GPS…'});return}const here={la:pos.latitude,lo:pos.longitude},d=hav(here,D),br=bearing(here,D),o={'Distanza':fmD(d),'Direzione verso la meta':Math.round(br)+'°','Precisione GPS':'±'+Math.round(pos.accuracy)+' m'};if(hd!=null){const rel=((br-hd+540)%360)-180;ar.style.transform='rotate('+rel+'deg)';o['Gira']=d<15?'✅ sei arrivato':Math.abs(rel)<10?'✅ dritto':(rel>0?'a destra di ':'a sinistra di ')+Math.abs(rel).toFixed(0)+'°'}u.val(o)};addEventListener('deviceorientation',h);return()=>{removeEventListener('deviceorientation',h);navigator.geolocation.clearWatch(gid);ar.remove()}}

{n:'Fotocamera',d:'Il sensore d\'immagine converte la luce in pixel. Qui calcolo la luminosità media dell\'inquadratura (0 = buio, 255 = bianco). Copri l\'obiettivo e guarda.',
 go:u=>camGo(u,'environment',(l,v)=>{u.val({'Luminosità':l.toFixed(0)+' / 255','Risoluzione':v.videoWidth+'×'+v.videoHeight});u.plot([l],0,255)})},
{n:'Touch',d:'Lo schermo capacitivo rileva le dita dal cambiamento del campo elettrico. Tocca l\'area con più dita: vedi numero di tocchi, posizione, raggio e (se disponibile) forza.',
 go:async u=>{const p=document.createElement('div');p.className='pad';p.textContent='Tocca qui con più dita';u.el.appendChild(p);const h=e=>{e.preventDefault();const o={'Dita':e.touches.length};[...e.touches].forEach((t,i)=>{o['#'+(i+1)]=Math.round(t.clientX)+', '+Math.round(t.clientY)+' · r'+Math.round(t.radiusX||0)+' · f'+(t.force||0).toFixed(2)});u.val(o)};['touchstart','touchmove','touchend'].forEach(k=>p.addEventListener(k,h,{passive:false}));return()=>p.remove()}},
{n:'Vibrazione',d:'Il motorino a massa eccentrica (Taptic Engine su iPhone) fa vibrare il telefono. Safari su iOS non permette di comandarlo dal web: funziona su Android/Chrome.',
 go:async u=>{if(!navigator.vibrate)throw new Error('Non supportata da Safari/iOS');navigator.vibrate([200,100,200,100,400]);u.val({'Stato':'vibrazione inviata'});return()=>navigator.vibrate(0)}},

/* ---- strumenti ---- */
{n:'🫧 Livella',d:'Livella a bolla digitale: usa l\'inclinazione calcolata da accelerometro e giroscopio. La bolla va verso il lato più alto; diventa verde quando il telefono è piatto (±1°). Appoggialo su una superficie per controllarla.',
 go:async u=>{await permOri();const b=document.createElement('div');b.style.cssText='position:relative;width:240px;height:240px;margin:14px auto 0;border-radius:50%;border:3px solid var(--mut)';const d=document.createElement('div');d.style.cssText='position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;opacity:.9';b.appendChild(d);u.el.appendChild(b);const cl=v=>Math.max(-30,Math.min(30,v));const h=e=>{const g=e.gamma||0,be=e.beta||0;d.style.transform='translate('+(-cl(g)/30*98)+'px,'+(-cl(be)/30*98)+'px)';const ok=Math.abs(g)<1&&Math.abs(be)<1;d.style.background=ok?'#4ade80':'var(--acc)';u.val({'Sinistra/destra':g.toFixed(1)+'°','Avanti/indietro':be.toFixed(1)+'°','Stato':ok?'✅ Piatto':'inclinato'})};addEventListener('deviceorientation',h);return()=>{removeEventListener('deviceorientation',h);b.remove()}}},
{n:'🔊 Fonometro',d:'Misura il rumore in dB con minimo, massimo e media. Il microfono non è calibrato: il valore è indicativo (≈ dB SPL). Per avvicinarti a un fonometro vero, confrontalo con uno e regola la calibrazione con i pulsanti.',
 init:u=>{u.btn('Calibra −1',()=>{cal--;ls('cal',cal);u.val({'Calibrazione':'+'+cal})});u.btn('Calibra +1',()=>{cal++;ls('cal',cal);u.val({'Calibrazione':'+'+cal})});u.btn('Azzera min/max',()=>{fm={min:999,max:-999,sum:0,n:0}})},
 go:u=>{fm={min:999,max:-999,sum:0,n:0};return micGo(db=>{const s=Math.max(0,db+cal);fm.min=Math.min(fm.min,s);fm.max=Math.max(fm.max,s);fm.sum+=s;fm.n++;u.val({'Livello':s.toFixed(1)+' dB','Minimo':fm.min.toFixed(1)+' dB','Massimo':fm.max.toFixed(1)+' dB','Media':(fm.sum/fm.n).toFixed(1)+' dB','Calibrazione':'+'+cal});u.plot([s],20,120)})}},
{n:'👟 Passi/sismo',d:'Contapassi e sismografo: misura quanto l\'accelerazione totale si discosta dalla gravità (9,8). Ogni picco sopra soglia è un passo; il grafico mostra le vibrazioni. Tieni il telefono in tasca e cammina, oppure appoggialo su un tavolo e batti vicino.',
 init:u=>u.btn('Azzera',()=>{steps=0;peak=0}),
 go:async u=>{await permMotion();steps=0;peak=0;return onMotion(e=>{const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x,a.y,a.z)-9.81,t=Date.now();peak=Math.max(peak,Math.abs(m));if(m>1.8&&t-lastStep>300){steps++;lastStep=t}u.val({'Passi':steps,'Intensità (m/s²)':m,'Picco massimo':peak});u.plot([m],-12,12)})}},
{n:'⏺ Registratore',d:'Registra 10 campioni al secondo di accelerometro, giroscopio, orientamento e GPS (se consentito). Premi Ferma e poi Salva/Condividi CSV (puoi scegliere "Salva su File") oppure Copia CSV. Massimo 10 minuti.',
 init:u=>{u.btn('Salva/Condividi CSV',()=>{if(!rec.rows.length)return u.err('Nessun dato registrato');u.err('');const csv=recCSV();const b=new Blob([csv],{type:'text/csv'});const f=new File([b],'sensori.csv',{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sensori.csv';a.click()}});u.btn('Copia CSV',async()=>{if(!rec.rows.length)return u.err('Nessun dato registrato');try{await navigator.clipboard.writeText(recCSV());u.err('Copiato ✓')}catch(e){u.err('Copia non riuscita')}});if(rec.rows.length)u.val({'Campioni salvati':rec.rows.length})},
 go:async u=>{await permMotion();await permOri().catch(()=>{});rec.rows=[];const t0=Date.now();let m={},o={},g={};const sm=onMotion(e=>{m={a:e.accelerationIncludingGravity||{},r:e.rotationRate||{}}});const fo=e=>{o={b:e.beta,g:e.gamma,h:e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:'')}};addEventListener('deviceorientation',fo);let gw=null;try{gw=navigator.geolocation.watchPosition(p=>{g={la:p.coords.latitude,lo:p.coords.longitude,s:p.coords.speed}},()=>{},{enableHighAccuracy:true})}catch(e){}const r=v=>v==null||v===''?'':(+v).toFixed(3);const t=setInterval(()=>{const a=m.a||{},rr=m.r||{};rec.rows.push([((Date.now()-t0)/1000).toFixed(1),r(a.x),r(a.y),r(a.z),r(rr.alpha),r(rr.beta),r(rr.gamma),r(o.b),r(o.g),r(o.h),g.la!=null?g.la.toFixed(6):'',g.lo!=null?g.lo.toFixed(6):'',r(g.s)]);u.val({'Campioni':rec.rows.length,'Durata':((Date.now()-t0)/1000).toFixed(0)+' s'});if(rec.rows.length>=6000)document.querySelector('.btn.stop')&&document.querySelector('.btn.stop').click()},100);return()=>{clearInterval(t);sm();removeEventListener('deviceorientation',fo);if(gw!=null)navigator.geolocation.clearWatch(gw)}}},
{n:'🚗 Tachimetro',d:'Velocità GPS con massima, media, distanza percorsa e traccia del percorso disegnata. Funziona meglio all\'aperto; i valori compaiono dopo qualche secondo di movimento. Usalo da passeggero o a piedi/in bici.',
 init:u=>u.btn('Azzera',()=>{tr={pts:[],dist:0,max:0,sum:0,n:0,last:null}}),
 go:async u=>{tr={pts:[],dist:0,max:0,sum:0,n:0,last:null};const id=navigator.geolocation.watchPosition(p=>{const c=p.coords,pt={la:c.latitude,lo:c.longitude};const v=c.speed!=null&&c.speed>=0?c.speed*3.6:null;if(!tr.last){if(c.accuracy<50){tr.last=pt;tr.pts.push(pt)}}else if(c.accuracy<30){const d=hav(tr.last,pt);if(d>3){tr.dist+=d;tr.last=pt;tr.pts.push(pt);if(tr.pts.length>3000)tr.pts.shift()}}if(v!=null){tr.max=Math.max(tr.max,v);tr.sum+=v;tr.n++}u.val({'Velocità':v!=null?v.toFixed(1)+' km/h':'—','Massima':tr.max.toFixed(1)+' km/h','Media':(tr.n?tr.sum/tr.n:0).toFixed(1)+' km/h','Distanza':(tr.dist/1000).toFixed(2)+' km','Precisione':'±'+Math.round(c.accuracy)+' m'});u.trace(tr.pts)},e=>u.err(e.message),{enableHighAccuracy:true});return()=>navigator.geolocation.clearWatch(id)}},
{n:'💡 Luxmetro',d:'Stima la luce ambiente con la fotocamera frontale. È molto approssimativa: la camera regola da sola l\'esposizione, quindi i lux sono indicativi (scala logaritmica). Usa i pulsanti per correggere il valore se hai un riferimento.',
 init:u=>{u.btn('Valori ÷2',()=>{lx.k/=2});u.btn('Valori ×2',()=>{lx.k*=2});u.btn('Azzera',()=>{lx={min:1e9,max:0,k:1}})},
 go:u=>{lx={min:1e9,max:0,k:1};return camGo(u,'user',l=>{const x=Math.round(Math.pow(10,l/255*4.5)*lx.k);lx.min=Math.min(lx.min,x);lx.max=Math.max(lx.max,x);const lab=x<10?'Buio':x<200?'Penombra':x<1000?'Interno':x<10000?'Molto luminoso':'Esterno/sole';u.val({'Luce stimata':'≈ '+x+' lux','Ambiente':lab,'Min':lx.min+' lux','Max':lx.max+' lux'});u.plot([Math.log10(x+1)],0,5)})}},
{n:'🪂 Caduta libera',d:'In caduta libera l\'accelerometro misura ≈0 (il telefono "non sente" la gravità). Lancia il telefono di pochi cm in aria e riprendilo: misuro il tempo di volo e stimo l\'altezza (h = g·t²/8). ATTENZIONE: fallo sopra un letto o un divano e tienilo ben stretto, mai su pavimento duro.',
 go:async u=>{await permMotion();let t0=null,last=null;return onMotion(e=>{const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.hypot(a.x,a.y,a.z),t=performance.now();if(m<3){if(t0===null)t0=t}else if(t0!==null){const d=(t-t0)/1000;t0=null;if(d>.1)last={d,h:9.81*d*d/8}}u.val({'Accelerazione |a|':m.toFixed(2)+' m/s²','Stato':t0!==null?'⬇️ in volo':'in mano/appoggiato','Ultimo volo':last?last.d.toFixed(2)+' s':'—','Altezza stimata':last?(last.h*100).toFixed(0)+' cm':'—'});u.plot([m],0,25)})}},
{n:'🌀 Giri',d:'Il giroscopio misura quanto velocemente ruoti. Tieni il telefono in mano e gira su te stesso, oppure appoggialo su un piatto girevole: integrando la velocità angolare conto i giri totali e i giri al minuto.',
 init:u=>u.btn('Azzera',()=>{gir=0}),
 go:async u=>{await permMotion();gir=0;let tl=null;return onMotion(e=>{const r=e.rotationRate;if(!r)return;const t=performance.now(),w=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0);if(tl!==null)gir+=w*(t-tl)/1000;tl=t;u.val({'Velocità':w.toFixed(0)+' °/s','Giri al minuto':(w/6).toFixed(1),'Giri totali':(gir/360).toFixed(2)});u.plot([w],0,720)})}},
{n:'📏 Dist. inclinazione',d:'Misura la distanza di un punto a TERRA con la trigonometria: inserisci l\'altezza della fotocamera da terra (cm), tieni il telefono dritto (verticale, non girato di lato) e punta il mirino sul punto dove l\'oggetto tocca il pavimento. Distanza = altezza × tan(inclinazione). Precisione indicativa (5-10%).',
 init:u=>{num(u,'inH','Altezza telefono da terra (cm)',ls('H')||150);u.btn('Blocca / sblocca misura',()=>{dl.lock=dl.lock?null:dl.cur})},
 go:async u=>{await permOri();dl.lock=null;dl.cur=null;const stop=await camGo(u,'environment',()=>{});const w=await wrapVideo(u);const c=document.createElement('div');c.style.cssText='position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border:2px solid #f87171;border-radius:50%;box-shadow:0 0 0 1px #000';w.appendChild(c);const hi=u.el.querySelector('#inH');const h=e=>{const be=e.beta;if(be==null)return;const H=+hi.value||0;ls('H',H);let t;if(be<5||be>=90)t=be>=90?'punta verso il basso':'troppo vicino';else if(be>=87)t='troppo lontano';else{dl.cur=H*Math.tan(be*Math.PI/180);t=dist(dl.cur)}const o={'Inclinazione dalla verticale':be.toFixed(1)+'°','Distanza':t};if(dl.lock)o['Bloccata']=dist(dl.lock);u.val(o)};addEventListener('deviceorientation',h);return()=>{removeEventListener('deviceorientation',h);stop();w.remove()}}},
{n:'📐 Dist. oggetto',d:'Misura la distanza da un oggetto di cui conosci la larghezza (es. foglio A4 = 21 cm, porta = 80 cm). Trascina le due linee gialle sui bordi dell\'oggetto. CALIBRAZIONE (una volta): metti l\'oggetto a una distanza nota, allinea le linee, inserisci la distanza e premi Calibra. Senza calibrazione il valore è molto approssimativo.',
 init:u=>{num(u,'inW','Larghezza reale oggetto (cm)',ls('W')||21);num(u,'inD','Distanza nota per calibrare (cm)',100);u.btn('Calibra',()=>{const W=+u.el.querySelector('#inW').value,D=+u.el.querySelector('#inD').value;if(W&&D&&ob.wf>.01){ob.F=D*ob.wf/W;ls('F',ob.F);u.err('Calibrato ✓ (salvato)')}else u.err('Allinea prima le linee all\'oggetto')});u.btn('Azzera calibrazione',()=>{ob.F=.96;ls('F',.96);u.err('Calibrazione azzerata')})},
 go:async u=>{const stop=await camGo(u,'environment',()=>{});const w=await wrapVideo(u);let p=[.3,.7],sl=null;const L=[0,1].map(()=>{const l=document.createElement('div');l.style.cssText='position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fbbf24;box-shadow:0 0 0 1px #000';w.appendChild(l);return l});const iw=u.el.querySelector('#inW');const calc=()=>{L.forEach((l,i)=>l.style.left=p[i]*100+'%');ob.wf=Math.abs(p[1]-p[0]);const W=+iw.value||0;ls('W',W);const d=ob.wf>.01?W*ob.F/ob.wf:0;u.val({'Larghezza in schermo':(ob.wf*100).toFixed(0)+'%','Distanza':d?dist(d):'—'})};const mv=e=>{e.preventDefault();const t=e.touches[0],r=w.getBoundingClientRect(),x=Math.max(0,Math.min(1,(t.clientX-r.left)/r.width));if(sl===null)sl=Math.abs(x-p[0])<Math.abs(x-p[1])?0:1;p[sl]=x;calc()};w.addEventListener('touchstart',e=>{sl=null;mv(e)},{passive:false});w.addEventListener('touchmove',mv,{passive:false});iw.addEventListener('input',calc);calc();return()=>{stop();w.remove()}}},
{n:'🎸 Accordatore',d:'Riconosce la nota che suoni o canti dal microfono (autocorrelazione) e dice di quanti cent sei calante o crescente rispetto alla nota esatta (La4 = 440 Hz). Funziona meglio con un suono alla volta, in ambiente silenzioso.',
 go:u=>{let k=0;return micGo((db,fd,hz,td,sr)=>{if(++k%4)return;const f=pitch(td,sr);if(!f){u.val({'Nota':'—','Frequenza':'—'});return}const m=69+12*Math.log2(f/440),r=Math.round(m),ce=(m-r)*100;u.val({'Nota':NN[((r%12)+12)%12]+Math.floor(r/12-1),'Frequenza':f.toFixed(1)+' Hz','Intonazione':(ce>=0?'+':'')+ce.toFixed(0)+' cent'+(Math.abs(ce)<5?' ✅':ce>0?' (crescente)':' (calante)')});u.plot([ce],-50,50)},2048)}},
{n:'📈 Oscilloscopio',d:'In alto la forma d\'onda del suono (ampiezza nel tempo, ingrandita automaticamente), in basso lo spettro (frequenze basse a sinistra). Un fischio è quasi una sinusoide pura; la voce è molto più complessa.',
 go:u=>micGo((db,fd,hz,td)=>{let pk=1;for(let i=1;i<fd.length;i++)if(fd[i]>fd[pk])pk=i;let mx=0;for(const v of td)mx=Math.max(mx,Math.abs(v));const nm=1/Math.max(mx,.05);const x=u.cv(),W=x.canvas.width,H=x.canvas.height;x.strokeStyle=ACC();x.lineWidth=3;x.beginPath();const n=td.length,st=Math.max(1,Math.floor(n/300));for(let i=0,j=0;i<n;i+=st,j++){const px=j/(n/st)*W,py=H*.25-td[i]*nm*H*.22;j?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.fillStyle=COL[1];const nb=96,w=W/nb;for(let i=0;i<nb;i++){const h=fd[i]/255*H*.45;x.fillRect(i*w,H-h,w-2,h)}u.val({'Livello':db.toFixed(1)+' dBFS','Frequenza dominante':Math.round(pk*hz)+' Hz'})},1024)},
{n:'⛰️ Inclinometro',d:'Misura l\'inclinazione di una superficie: appoggia il telefono (schermo in su) su rampa, tetto o scaffale. Mostra angolo e pendenza in %. "Asse lungo/corto" servono se lo appoggi di taglio. Premi "Imposta zero" su una superficie piana per calibrare.',
 init:u=>u.btn('Imposta zero',()=>{incZ=incCur}),
 go:async u=>{await permMotion();return onMotion(e=>{const a=e.accelerationIncludingGravity;if(!a)return;const g=Math.hypot(a.x,a.y,a.z)||1,t=Math.acos(Math.min(1,Math.abs(a.z)/g))*180/Math.PI;incCur=t;const z=t-incZ;u.val({'Inclinazione':z.toFixed(1)+'°','Pendenza':Math.abs(z)>=89?'∞':(Math.tan(Math.abs(z)*Math.PI/180)*100).toFixed(1)+' %','Asse lungo':(Math.asin(Math.max(-1,Math.min(1,a.y/g)))*180/Math.PI).toFixed(1)+'°','Asse corto':(Math.asin(Math.max(-1,Math.min(1,a.x/g)))*180/Math.PI).toFixed(1)+'°'});u.plot([z],-45,45)})}},
{n:'🔁 Pendolo',d:'Appendi il telefono a un filo (o tienilo con una cordicella) e fallo oscillare con piccole ampiezze. Misuro il periodo con il giroscopio e, inserendo la lunghezza del filo (dal punto di sospensione al telefono), stimo g = 4π²L/T² (≈9,81 m/s²).',
 init:u=>num(u,'inL','Lunghezza filo (cm)',100),
 go:async u=>{await permMotion();const Li=u.el.querySelector('#inL');let e3=[0,0,0],armed=false,lastT=0,Ts=[],cnt=0;return onMotion(e=>{const r=e.rotationRate;if(!r)return;const v=[r.alpha||0,r.beta||0,r.gamma||0];e3=e3.map((q,i)=>q*.98+Math.abs(v[i])*.02);const k=e3.indexOf(Math.max(...e3)),sg=v[k],t=performance.now();if(sg<-15)armed=true;else if(sg>15&&armed){armed=false;if(lastT){const T=(t-lastT)/1000;if(T>.3&&T<6){Ts.push(T);if(Ts.length>6)Ts.shift();cnt++}}lastT=t}const T=Ts.length?Ts.reduce((a,b)=>a+b)/Ts.length:0,L=(+Li.value||0)/100;u.val({'Periodo':T?T.toFixed(3)+' s':'—','Frequenza':T?(1/T).toFixed(2)+' Hz':'—','g stimata':T&&L?(4*Math.PI*Math.PI*L/(T*T)).toFixed(2)+' m/s²':'—','Oscillazioni':cnt});u.plot([sg],-150,150)})}},
{n:'📣 Eco',d:'SPERIMENTALE. Emette un breve impulso sonoro e ascolta il ritorno dal muro: dal ritardo ricavo la distanza (velocità del suono 343 m/s). Serve stanza silenziosa, volume al massimo, telefono rivolto al muro a 1,5–15 m. Premi Avvia, poi "Emetti impulso".',
 init:u=>u.btn('Emetti impulso',()=>{if(ech.fire)ech.fire();else u.err('Premi prima Avvia')}),
 go:async u=>{const ac=new(window.AudioContext||webkitAudioContext)();ac.resume();const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const src=ac.createMediaStreamSource(st),sp=ac.createScriptProcessor(2048,1,1),z=ac.createGain();z.gain.value=0;src.connect(sp);sp.connect(z);z.connect(ac.destination);let rec=null;sp.onaudioprocess=e=>{if(rec)rec.push(new Float32Array(e.inputBuffer.getChannelData(0)))};const sr=ac.sampleRate,N=Math.round(sr*.01),tm=new Float32Array(N);for(let i=0;i<N;i++){const t=i/sr,T=N/sr;tm[i]=Math.sin(2*Math.PI*(1500*t+3000*t*t/(2*T)))*(.5-.5*Math.cos(2*Math.PI*i/N))}
 ech.fire=()=>{if(rec)return;rec=[];const b=ac.createBuffer(1,N,sr);b.copyToChannel(tm,0);const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start();u.err('Ascolto…');setTimeout(()=>{const parts=rec;rec=null;const L=parts.reduce((a,p)=>a+p.length,0),x=new Float32Array(L);let o=0;parts.forEach(p=>{x.set(p,o);o+=p.length});const M=L-N;if(M<N*4){u.err('Registrazione troppo corta');return}const env=new Float32Array(M);for(let i=0;i<M;i++){let q=0;for(let j=0;j<N;j++)q+=tm[j]*x[i+j];env[i]=Math.abs(q)}let p0=0;for(let i=0;i<M;i++)if(env[i]>env[p0])p0=i;const gap=Math.round(sr*.006),maxd=Math.round(sr*.12);let p1=-1,v1=0;for(let i=p0+gap;i<Math.min(M,p0+maxd);i++)if(env[i]>v1){v1=env[i];p1=i}u.err('');if(p1<0||v1<.12*env[p0]){u.val({'Risultato':'nessun eco chiaro'});return}const dt=(p1-p0)/sr;u.val({'Ritardo eco':(dt*1000).toFixed(1)+' ms','Distanza muro':(343*dt/2).toFixed(2)+' m','Forza eco':(100*v1/env[p0]).toFixed(0)+'%'})},700)};
 return()=>{ech.fire=null;sp.disconnect();src.disconnect();st.getTracks().forEach(t=>t.stop());ac.close()}}},
{n:'⏱️ Reazione',d:'Test del tempo di reazione: tocca l\'area quando diventa verde, il più in fretta possibile. Se tocchi prima, ricomincia. Un valore tipico è 200–300 ms.',
 go:async u=>{const p=document.createElement('div');p.className='pad';p.textContent='Tocca per iniziare';u.el.appendChild(p);let res=[],t0=0,state=0,tm=null;const arm=()=>{state=1;p.style.background='';p.textContent='Aspetta il verde…';tm=setTimeout(()=>{state=2;t0=performance.now();p.style.background='#4ade80';p.textContent='ORA! Tocca'},1500+Math.random()*2500)};const h=e=>{e.preventDefault();if(state===1){clearTimeout(tm);u.err('Troppo presto!');arm()}else if(state===2){const ms=performance.now()-t0;res.push(ms);u.err('');u.val({'Ultimo':ms.toFixed(0)+' ms','Migliore':Math.min(...res).toFixed(0)+' ms','Media':(res.reduce((a,b)=>a+b)/res.length).toFixed(0)+' ms','Prove':res.length});arm()}else arm()};p.addEventListener('pointerdown',h);return()=>{clearTimeout(tm);p.remove()}}},
{n:'☀️ Sole',d:'Calcola dove si trova il sole (azimut = direzione dal Nord, altezza sull\'orizzonte) dalla tua posizione GPS e dall\'ora, e la freccia indica dove girarti usando la bussola. Mai guardare il sole direttamente.',

{n:'🏢 Altezza',d:'Misura l\'altezza di un oggetto (albero, palazzo). Inserisci l\'altezza del telefono da terra, resta in piedi davanti all\'oggetto con il telefono dritto: 1) punta il mirino sulla BASE e premi "Segna base"; 2) punta sulla CIMA e premi "Segna cima". Precisione indicativa.',

{n:'🚨 Allarme',d:'Allarme anti-spostamento: appoggia il telefono (su un tavolo, nella borsa, sul letto) e premi Avvia. Dopo 3 secondi si arma; se viene mosso suona una sirena e vibra. "Silenzia e riarma" la spegne. Regola la sensibilità con i pulsanti. Volume alto!',
 init:u=>{u.btn('Meno sensibile',()=>{al.th*=1.5});u.btn('Più sensibile',()=>{al.th/=1.5});u.btn('Silenzia e riarma',()=>{if(al.silence)al.silence()})},
 go:async u=>{await permMotion();const ac=AC();ac.resume();let armAt=Date.now()+3000,on=false,osc=null,iv=null,n=0,last='—';const sil=()=>{if(osc){try{osc.stop()}catch(e){}osc=null}clearInterval(iv);on=false;armAt=Date.now()+3000};al.silence=sil;const trig=()=>{on=true;n++;last=new Date().toLocaleTimeString('it-IT');osc=ac.createOscillator();osc.type='square';const g=ac.createGain();g.gain.value=.6;osc.connect(g);g.connect(ac.destination);osc.start();let f=0;iv=setInterval(()=>{osc.frequency.value=f++%2?1100:700;navigator.vibrate&&navigator.vibrate(200)},300)};const off=onMotion(e=>{const a=e.accelerationIncludingGravity;if(!a)return;const dv=Math.abs(Math.hypot(a.x,a.y,a.z)-9.81),t=Date.now();if(t>armAt&&!on&&dv>al.th)trig();u.val({'Stato':t<armAt?'si arma tra '+Math.ceil((armAt-t)/1000)+' s':on?'🚨 ALLARME':'🟢 armato','Scostamento':dv.toFixed(2),'Soglia':al.th.toFixed(2),'Allarmi':n,'Ultimo':last})});return()=>{off();sil();al.silence=null;ac.close()}}},
{n:'🎨 Colore',d:'Contagocce: inquadra una superficie e leggi nome, codice HEX e RGB del colore al centro del mirino (media di una piccola area). I colori dipendono dalla luce: usa luce bianca e uniforme.',

 go:async u=>{const sw=document.createElement('div');sw.style.cssText='height:50px;border-radius:10px;margin-top:14px;border:1px solid var(--chip)';u.el.appendChild(sw);const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d',{willReadFrequently:true});const stop=await camGo(u,'environment',(l,v)=>{if(!v.videoWidth)return;const q=Math.min(v.videoWidth,v.videoHeight)*.08;x.drawImage(v,v.videoWidth/2-q/2,v.videoHeight/2-q/2,q,q,0,0,8,8);const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}r=Math.round(r/64);g=Math.round(g/64);b=Math.round(b/64);const hex='#'+[r,g,b].map(k=>k.toString(16).padStart(2,'0')).join('').toUpperCase();col.hex=hex;sw.style.background=hex;u.val({'Colore':nameColor(r,g,b),'HEX':hex,'RGB':r+', '+g+', '+b})});const w=await wrapVideo(u);crossHair(w);return()=>{stop();sw.remove();w.remove()}}},
{n:'🏎️ G-meter',d:'Misura le accelerazioni in g (senza la gravità) con picchi massimi. Fissa il telefono saldo in auto, verticale con lo schermo verso il guidatore: Z = accelerazione/frenata, X = curva, Y = buche. Usalo solo da passeggero o con il telefono ben fissato.',
 init:u=>u.btn('Azzera picchi',()=>{gm={max:0,mx:[0,0,0]}}),
 go:async u=>{await permMotion();gm={max:0,mx:[0,0,0]};return onMotion(e=>{const a=e.acceleration;if(!a||a.x==null)return u.err('Accelerazione lineare non disponibile');u.err('');const v=[a.x,a.y,a.z].map(q=>q/9.81),t=Math.hypot(...v);gm.max=Math.max(gm.max,t);v.forEach((q,i)=>gm.mx[i]=Math.max(gm.mx[i],Math.abs(q)));u.val({'G totale':t.toFixed(2)+' g','Picco massimo':gm.max.toFixed(2)+' g','X curva':v[0].toFixed(2),'Y buche':v[1].toFixed(2),'Z acc./freno':v[2].toFixed(2),'Picchi X / Y / Z':gm.mx.map(q=>q.toFixed(2)).join(' / ')});u.plot(v,-1.5,1.5)})}},
{n:'📳 Vibrazioni',d:'Analizza la frequenza di una vibrazione (lavatrice, motore, tavolo, ventola) con la FFT dell\'accelerometro. Appoggia il telefono sull\'oggetto. Il limite è circa metà della frequenza di campionamento (≈30 Hz su iPhone).',
 go:async u=>{await permMotion();const B=[[],[],[]],T=[];let cn=0;return onMotion(e=>{const a=e.accelerationIncludingGravity;if(!a)return;T.push(performance.now());[a.x,a.y,a.z].forEach((q,i)=>B[i].push(q));if(T.length>256){T.shift();B.forEach(b=>b.shift())}if(T.length<256||++cn%12)return;const fs=255/((T[255]-T[0])/1000),sp=B.map(b=>{const m=b.reduce((p,c)=>p+c)/256;return dft(b.map(q=>q-m),fs)}),tot=new Float32Array(128);let pk=1;for(let k=1;k<128;k++){tot[k]=Math.hypot(sp[0][k],sp[1][k],sp[2][k]);if(tot[k]>tot[pk])pk=k}const mx=tot[pk]||1,bars=new Uint8Array(96);for(let k=0;k<96;k++)bars[k]=Math.min(255,tot[k]/mx*255);u.bars(bars);u.val({'Frequenza dominante':(pk*fs/256).toFixed(1)+' Hz','Ampiezza':(4*tot[pk]).toFixed(3)+' m/s²','Campionamento':fs.toFixed(0)+' Hz','Intervallo':'0 – '+(fs/2).toFixed(0)+' Hz'})})}},
{n:'🎥 Movimento',d:'Rilevatore di movimento con la fotocamera: appoggia il telefono fermo e inquadra l\'area da controllare. Quando i pixel cambiano oltre la soglia segnala "MOVIMENTO", bip e vibrazione. Funziona solo con la pagina aperta e lo schermo acceso.',
 init:u=>{u.btn('Più sensibile',()=>{mo.th=Math.max(.2,mo.th/1.5)});u.btn('Meno sensibile',()=>{mo.th*=1.5});u.btn('Suono on/off',()=>{mo.beep=!mo.beep;u.err('Suono '+(mo.beep?'attivo':'spento'))})},
 go:async u=>{const ac=AC();ac.resume();const c=document.createElement('canvas');c.width=48;c.height=36;const x=c.getContext('2d',{willReadFrequently:true});let prev=null,n=0,last='—',cool=0;const stop=await camGo(u,'environment',(l,v)=>{if(!v.videoWidth)return;x.drawImage(v,0,0,48,36);const d=x.getImageData(0,0,48,36).data,cur=new Uint8Array(1728);for(let i=0;i<1728;i++)cur[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];let ch=0;if(prev)for(let i=0;i<1728;i++)if(Math.abs(cur[i]-prev[i])>25)ch++;const pc=ch/17.28;prev=cur;const mv=pc>mo.th;if(mv&&Date.now()>cool){n++;cool=Date.now()+1500;last=new Date().toLocaleTimeString('it-IT');if(mo.beep){const o=ac.createOscillator();o.frequency.value=880;o.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}navigator.vibrate&&navigator.vibrate(100)}v.style.outline=mv?'4px solid #f87171':'none';u.val({'Stato':mv?'🔴 MOVIMENTO':'🟢 fermo','Variazione':pc.toFixed(1)+'%','Soglia':mo.th.toFixed(1)+'%','Rilevamenti':n,'Ultimo':last});u.plot([pc],0,20)});return()=>{stop();ac.close()}}},
{n:'🎼 Toni',d:'Generatore di toni puri (sinusoide, quadra, triangolare, sega), sweep 20 Hz–20 kHz in 20 s e rumore bianco. Utile per testare casse e udito. Parte a volume basso: alzalo con calma e occhio alle cuffie.',
 init:u=>{num(u,'inF','Frequenza (Hz)',440);[['sine','Sinus.'],['square','Quadra'],['triangle','Triang.'],['sawtooth','Sega']].forEach(([t,n])=>u.btn(n,()=>{gen.type=t;gen.mode='tone';gen.apply&&gen.apply()}));u.btn('Sweep 20-20k',()=>{gen.mode='sweep';gen.apply&&gen.apply()});u.btn('Rumore bianco',()=>{gen.mode='noise';gen.apply&&gen.apply()});u.btn('Volume −',()=>{gen.vol=Math.max(.02,gen.vol/1.6);gen.apply&&gen.apply()});u.btn('Volume +',()=>{gen.vol=Math.min(1,gen.vol*1.6);gen.apply&&gen.apply()})},
 go:async u=>{const ac=AC();ac.resume();const g=ac.createGain();g.connect(ac.destination);let node=null,iv=null;const fi=u.el.querySelector('#inF');const stopN=()=>{if(node){try{node.stop()}catch(e){}node.disconnect();node=null}clearInterval(iv)};const apply=()=>{g.gain.value=gen.vol;stopN();const vol=Math.round(gen.vol*100)+'%';if(gen.mode==='noise'){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;node=ac.createBufferSource();node.buffer=b;node.loop=true;node.connect(g);node.start();u.val({'Segnale':'rumore bianco','Volume':vol})}else{node=ac.createOscillator();node.type=gen.type;node.connect(g);if(gen.mode==='sweep'){const t0=ac.currentTime;node.frequency.setValueAtTime(20,t0);node.frequency.exponentialRampToValueAtTime(20000,t0+20);node.start();iv=setInterval(()=>{const f=20*Math.pow(1000,Math.min(1,(ac.currentTime-t0)/20));u.val({'Segnale':'sweep','Frequenza':f.toFixed(0)+' Hz','Volume':vol})},200)}else{const f=+fi.value||440;node.frequency.value=f;node.start();u.val({'Segnale':gen.type,'Frequenza':f+' Hz','Volume':vol})}}};gen.apply=apply;fi.addEventListener('input',()=>{if(gen.mode==='tone')apply()});gen.mode='tone';apply();return()=>{stopN();gen.apply=null;ac.close()}}},
{n:'🥁 Metronomo',d:'Metronomo preciso (clic accentato ogni 4 battute) con tap tempo: tocca TAP a ritmo per ricavare i BPM (anche senza avviare). Il pallino lampeggia a tempo.',
 init:u=>{num(u,'inB','BPM',mt.bpm);u.btn('TAP',()=>{const t=performance.now();if(mt.tap.length&&t-mt.tap[mt.tap.length-1]>2000)mt.tap=[];mt.tap.push(t);if(mt.tap.length>7)mt.tap.shift();if(mt.tap.length>=2){mt.bpm=Math.round(60000/((mt.tap[mt.tap.length-1]-mt.tap[0])/(mt.tap.length-1)));u.el.querySelector('#inB').value=mt.bpm;u.val({'BPM (tap)':mt.bpm})}})},
 go:async u=>{const ac=AC();ac.resume();const bi=u.el.querySelector('#inB');const dot=document.createElement('div');dot.style.cssText='width:60px;height:60px;border-radius:50%;margin:14px auto 0;background:var(--chip)';u.el.appendChild(dot);let next=ac.currentTime+.1,beat=0;const iv=setInterval(()=>{const bpm=Math.max(30,Math.min(300,+bi.value||100));while(next<ac.currentTime+.2){const o=ac.createOscillator(),g=ac.createGain(),b=beat;o.frequency.value=b%4?800:1200;g.gain.setValueAtTime(.5,next);g.gain.exponentialRampToValueAtTime(.001,next+.06);o.connect(g);g.connect(ac.destination);o.start(next);o.stop(next+.07);setTimeout(()=>{dot.style.background=b%4?'var(--acc)':'#f87171';setTimeout(()=>dot.style.background='var(--chip)',90)},Math.max(0,(next-ac.currentTime)*1000));next+=60/bpm;beat++}u.val({'BPM':bpm,'Battuta':(beat-1)%4+1})},50);return()=>{clearInterval(iv);dot.remove();ac.close()}}},
{n:'🗺️ Traccia GPX',d:'Registra il percorso GPS (distanza, dislivello in salita, durata, velocità media) e lo disegna. Alla fine premi "Salva/Condividi GPX" (scegli "Salva su File") o "Copia GPX": il file si apre in Google Maps, Strava, Komoot, ecc. Tieni la pagina aperta durante il percorso.',
 init:u=>{u.btn('Salva/Condividi GPX',()=>shareFile(u,'percorso.gpx','text/xml',gp.pts.length>1?gpxText():''));u.btn('Copia GPX',async()=>{if(gp.pts.length<2)return u.err('Nessun dato');try{await navigator.clipboard.writeText(gpxText());u.err('Copiato ✓')}catch(e){u.err('Copia non riuscita')}});u.btn('Azzera',()=>{gp={pts:[],dist:0,asc:0,ref:null,t0:Date.now()}});if(gp.pts.length)setTimeout(()=>u.trace(gp.pts),0)},
 go:async u=>{if(!gp.pts.length)gp.t0=Date.now();const id=navigator.geolocation.watchPosition(p=>{const c=p.coords,pt={la:c.latitude,lo:c.longitude,el:c.altitude,t:p.timestamp};const l=gp.pts[gp.pts.length-1];if(c.accuracy<30&&(!l||hav(l,pt)>5)){if(l)gp.dist+=hav(l,pt);gp.pts.push(pt);if(gp.pts.length>20000)gp.pts.shift();if(pt.el!=null){if(gp.ref==null)gp.ref=pt.el;else if(pt.el-gp.ref>3){gp.asc+=pt.el-gp.ref;gp.ref=pt.el}else if(gp.ref-pt.el>3)gp.ref=pt.el}}const sec=(Date.now()-gp.t0)/1000;u.val({'Distanza':(gp.dist/1000).toFixed(2)+' km','Dislivello +':Math.round(gp.asc)+' m','Durata':Math.floor(sec/60)+' min '+Math.round(sec%60)+' s','Velocità media':sec>5?(gp.dist/sec*3.6).toFixed(1)+' km/h':'—','Punti':gp.pts.length,'Precisione':'±'+Math.round(c.accuracy)+' m'});u.trace(gp.pts)},e=>u.err(e.message),{enableHighAccuracy:true});return()=>navigator.geolocation.clearWatch(id)}},
{n:'❤️ Battito',d:'Misura il battito con la fotocamera posteriore: copri l\'obiettivo con il polpastrello (senza premere forte), resta fermo 10–15 s, in un posto ben illuminato. Su iPhone la torcia non è controllabile dal web, quindi è meno affidabile. NON è un dispositivo medico.',
 go:async u=>{let S=[],T=[];const stop=await camGo(u,'environment',(l,v,rd)=>{const t=performance.now();if(!v.tt){v.tt=1;try{v.srcObject.getVideoTracks()[0].applyConstraints({advanced:[{torch:true}]}).catch(()=>{})}catch(e){}}const finger=rd>90&&l/rd<.6;if(!finger){S=[];T=[];u.val({'Stato':'copri la fotocamera posteriore con il dito','Battito':'—'});return}S.push(rd);T.push(t);while(T[0]<t-12000){S.shift();T.shift()}const n=S.length,sec=(T[n-1]-T[0])/1000;if(sec<6){u.val({'Stato':'misuro… tieni fermo ('+Math.round(sec)+'/6 s)'});return}const fs=n/sec,w=Math.max(3,Math.round(fs*.8)),y=new Array(n);for(let i=0;i<n;i++){const a=Math.max(0,i-w),b=Math.min(n-1,i+w);let m=0;for(let j=a;j<=b;j++)m+=S[j];y[i]=S[i]-m/(b-a+1)}const z=y.map((q,i)=>i>0&&i<n-1?(y[i-1]+2*q+y[i+1])/4:q),sd=Math.sqrt(z.reduce((p,q)=>p+q*q,0)/n)||1,pk=[];for(let i=1;i<n-1;i++)if(z[i]>z[i-1]&&z[i]>=z[i+1]&&z[i]>.3*sd){if(!pk.length||T[i]-T[pk[pk.length-1]]>330)pk.push(i);else if(z[i]>z[pk[pk.length-1]])pk[pk.length-1]=i}const iv=[];for(let i=1;i<pk.length;i++){const d=(T[pk[i]]-T[pk[i-1]])/1000;if(d>.33&&d<1.5)iv.push(d)}iv.sort((a,b)=>a-b);const bpm=iv.length>=3?60/iv[iv.length>>1]:null;u.val({'Stato':bpm?'ok':'segnale debole, tieni fermo','Battito':bpm?Math.round(bpm)+' bpm':'—','Battiti rilevati':pk.length});u.plot([z[n-1]/sd],-3,3)},33);return stop}},
{n:'🧩 Dashboard',d:'Tutti i sensori principali in un\'unica schermata: movimento, orientamento, GPS e rumore, aggiornati in tempo reale. Concedi i permessi quando richiesti (movimento, posizione, microfono): ogni valore appare appena il relativo permesso è concesso.',
 go:async u=>{const o={'Stato':'in attesa dei permessi…'};let alive=true,stopM=null,got=false;const f=q=>(q||0).toFixed(1);const mk=()=>{if(!got){got=true;delete o['Stato']}};

 const offM=onMotion(e=>{const a=e.accelerationIncludingGravity,r=e.rotationRate;if(a){mk();o['Accelerazione x/y/z']=f(a.x)+' / '+f(a.y)+' / '+f(a.z)}if(r)o['Giroscopio α/β/γ']=f(r.alpha)+' / '+f(r.beta)+' / '+f(r.gamma)});
 const ho=e=>{mk();const hd=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);if(hd!=null)o['Bussola']=Math.round(hd)+'°';o['Inclinazione β/γ']=(e.beta||0).toFixed(0)+'° / '+(e.gamma||0).toFixed(0)+'°'};addEventListener('deviceorientation',ho);
 let gid=null;try{gid=navigator.geolocation.watchPosition(p=>{mk();const c=p.coords;o['GPS']=c.latitude.toFixed(4)+', '+c.longitude.toFixed(4);o['Altitudine']=c.altitude!=null?Math.round(c.altitude)+' m':'—';o['Velocità']=c.speed!=null?(c.speed*3.6).toFixed(1)+' km/h':'—'},()=>{o['GPS']='non consentito'},{enableHighAccuracy:true})}catch(e){o['GPS']='non disponibile'}

{n:'🎮 Pallina',d:'Gioco: inclina il telefono per far rotolare la pallina fino al verde, evitando le buche nere (3 livelli). Impara come l\'accelerometro sente l\'inclinazione. Si calibra da solo sulla posizione in cui lo tieni all\'avvio.',

 go:async u=>{await permOri();let li=0,x=0,y=0,vx=0,vy=0,falls=0,t0=performance.now(),run=true,first=true,fr=0;const cv=document.createElement('canvas');cv.width=cv.height=600;cv.style.cssText='width:100%;height:auto;aspect-ratio:1;margin-top:14px;border-radius:10px;background:var(--bg);display:block';u.el.appendChild(cv);const g=cv.getContext('2d'),R=3;const load=()=>{const L=LV[li];x=L.s[0];y=L.s[1];vx=vy=0};load();pb.reset=()=>{li=0;falls=0;t0=performance.now();load();u.err('')};const h=e=>{pb.g=e.gamma||0;pb.b=e.beta||0;if(first){pb.cg=pb.g;pb.cb=pb.b;first=false}};addEventListener('deviceorientation',h);const hit=(px,py,w)=>{const nx=Math.max(w[0],Math.min(px,w[0]+w[2])),ny=Math.max(w[1],Math.min(py,w[1]+w[3]));return Math.hypot(px-nx,py-ny)<R};let last=performance.now();const step=t=>{if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;const L=LV[li],ax=Math.sin((pb.g-pb.cg)*Math.PI/180)*300,ay=Math.sin((pb.b-pb.cb)*Math.PI/180)*300;vx=(vx+ax*dt)*.992;vy=(vy+ay*dt)*.992;let nx=x+vx*dt;if(nx<R||nx>100-R||L.w.some(w=>hit(nx,y,w))){vx*=-.3;nx=x}x=nx;let ny=y+vy*dt;if(ny<R||ny>100-R||L.w.some(w=>hit(x,ny,w))){vy*=-.3;ny=y}y=ny;if(L.h.some(q=>Math.hypot(q[0]-x,q[1]-y)<4)){falls++;load()}else if(Math.hypot(L.g[0]-x,L.g[1]-y)<5){li++;if(li>=LV.length){li=0;u.err('🏆 Completato! Tempo '+((performance.now()-t0)/1000).toFixed(0)+' s, cadute '+falls);t0=performance.now();falls=0}load()}g.clearRect(0,0,600,600);g.fillStyle='#64748b';LV[li].w.forEach(w=>g.fillRect(w[0]*6,w[1]*6,w[2]*6,w[3]*6));g.fillStyle='#000';LV[li].h.forEach(q=>{g.beginPath();g.arc(q[0]*6,q[1]*6,24,0,7);g.fill()});g.fillStyle='#4ade80';g.beginPath();g.arc(LV[li].g[0]*6,LV[li].g[1]*6,30,0,7);g.fill();g.fillStyle=ACC();g.beginPath();g.arc(x*6,y*6,R*6,0,7);g.fill();if(++fr%10===0)u.val({'Livello':(li+1)+' / '+LV.length,'Cadute':falls,'Tempo':((performance.now()-t0)/1000).toFixed(0)+' s'});requestAnimationFrame(step)};requestAnimationFrame(step);return()=>{run=false;removeEventListener('deviceorienta {n:'🌈 Spettrogramma',d:'Il suono come mappa nel tempo: scorre da destra a sinistra, le frequenze basse stanno in basso e le acute in alto (0–8 kHz), il colore è l\'intensità. Prova a fischiare, parlare, battere le mani.',

{n:'👂 Udito',d:'Test dell\'udito INDICATIVO (non medico): per 8 frequenze il tono parte dal silenzio e sale piano. Premi "Lo sento" appena lo percepisci. Meglio con cuffie, stanza silenziosa e volume del telefono basso/medio. I risultati dipendono da cuffie e volume.',

 go:async u=>{const ac=AC();ac.resume();const F=[250,500,1000,2000,4000,8000,12000,16000],res=[],T=8;let i=0,osc=null,t0=0,timer=null,iv=null;const stopT=()=>{clearTimeout(timer);clearInterval(iv);if(osc){try{osc.stop()}catch(e){}osc.disconnect();osc=null}};const lvl=()=>.0005*Math.pow(.25/.0005,Math.min(1,(ac.currentTime-t0)/T));const show=()=>{const o={};F.forEach((f,k)=>{o[f+' Hz']=k<res.length?(res[k]===null?'non sentito':(20*Math.log10(res[k])).toFixed(0)+' dB'):'—'});u.val(o);const x=u.cv(),W=x.canvas.width,H=x.canvas.height,bw=W/F.length;x.fillStyle=ACC();res.forEach((r,k)=>{const h=r===null?3:H*(1-(20*Math.log10(r)+66)/60);x.fillRect(k*bw+6,H-Math.max(3,h),bw-12,Math.max(3,h))})};const next=()=>{stopT();if(i>=F.length){u.err('Test finito. Barre più alte = senti meglio (soglia più bassa).');show();return}u.err('Tono '+(i+1)+'/'+F.length+': '+F[i]+' Hz — premi "Lo sento!" appena lo senti');osc=ac.createOscillator();const g=ac.createGain();osc.frequency.value=F[i];g.gain.setValueAtTime(.0005,ac.currentTime);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+T);osc.connect(g);g.connect(ac.destination);osc.start();t0=ac.currentTime;timer=setTimeout(()=>ht.hear(false),(T+.5)*1000)};ht.hear=heard=>{if(!osc)return;res.push(heard?lvl():null);i++;next();show()};next();return()=>{stopT();ht.hear=null;ac.close()}}},
{n:'👏 Battiti mani',d:'Conta battiti di mani e rumori improvvisi: rileva i picchi rispetto al rumore di fondo e calcola il ritmo (battiti al minuto). Regola la sensibilità.',

 go:async u=>{await permOri();const sc=document.createElement('div');sc.style.cssText='perspective:700px;height:280px;display:flex;align-items:center;justify-content:center;margin-top:10px;overflow:hidden';const view=document.createElement('div');view.style.cssText='transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-30deg)';const cube=document.createElement('div');cube.style.cssText='position:relative;width:0;height:0;transform-style:preserve-3d';const face=(w,h,tr,bg,t)=>{const f=document.createElement('div');f.style.cssText='position:absolute;left:'+(-w/2)+'px;top:'+(-h/2)+'px;width:'+w+'px;height:'+h+'px;transform:'+tr+';background:'+bg+';border:2px solid #0f172a;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 11px system-ui;color:#0f172a;backface-visibility:hidden';f.textContent=t;cube.appendChild(f)};face(90,170,'translateZ(10px)','#38bdf8','SCHERMO');face(90,170,'rotateY(180deg) translateZ(10px)','#64748b','RETRO');face(20,170,'rotateY(-90deg) translateZ(45px)','#fbbf24','SX');face(20,170,'rotateY(90deg) translateZ(45px)','#fbbf24','DX');face(90,20,'rotateX(90deg) translateZ(85px)','#4ade80','ALTO');face(90,20,'rotateX(-90deg) translateZ(85px)','#f87171','BASSO');view.appendChild(cube);sc.appendChild(view);u.el.appendChild(sc);const h=e=>{const be=e.beta||0,g=e.gamma||0;cube.style.transform='rotateX('+(90-be)+'deg) rotateY('+g+'deg)';u.val({'Beta (avanti/indietro)':be.toFixed(0)+'°','Gamma (sinistra/destra)':g.toFixed(0)+'°','Alpha (rotazione)':(e.alpha||0).toFixed(0)+'°'})};addEventListener('deviceorientation',h);return()=>{removeEventListener('deviceorientation',h);sc.remove()}}},

  btn(t,f){const b=document.createElement('button');b.className='btn2';b.textContent=t;b.onclick=f;el.appendChild(b)},
  cv(){cv.style.display='block';cv.width=cv.clientWidth*2;cv.height=280;return cv.getContext('2d')},
  plot(a,mn,mx){const x=u.cv();a.forEach((v,k)=>{(buf[k]=buf[k]||[]).push(v);if(buf[k].length>150)buf[k].shift()});x.strokeStyle='rgba(148,163,184,.4)';x.lineWidth=2;x.beginPath();const z=cv.height*(mx/(mx-mn));x.moveTo(0,z);x.lineTo(cv.width,z);x.stroke();buf.forEach((b,k)=>{x.strokeStyle=COL[k];x.lineWidth=3;x.beginPath();b.forEach((v,j)=>{const px=j/150*cv.width,py=cv.height*(1-(Math.max(mn,Math.min(mx,v))-mn)/(mx-mn));j?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})},
  bars(f){const x=u.cv();const n=96,w=cv.width/n;x.fillStyle=ACC();for(let i=0;i<n;i++){const h=f[i]/255*cv.height;x.fillRect(i*w,cv.height-h,w-2,h)}},
  trace(pts){if(pts.length<2)return;const x=u.cv();const k=Math.cos(pts[0].la*Math.PI/180);let a=1e9,b=-1e9,c2=1e9,d=-1e9;pts.forEach(p=>{const X=p.lo*k,Y=-p.la;a=Math.min(a,X);b=Math.max(b,X);c2=Math.min(c2,Y);d=Math.max(d,Y)});const sp=Math.max(b-a,d-c2,2e-5),P=24,sc=(Math.min(cv.width,cv.height)-2*P)/sp;x.strokeStyle=ACC();x.lineWidth=4;x.lineJoin='round';x.beginPath();pts.forEach((p,j)=>{const px=P+(p.lo*k-a)*sc,py=P+(-p.la-c2)*sc;j?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();const l=pts[pts.length-1];x.fillStyle='#f87171';x.beginPath();x.arc(P+(l.lo*k-a)*sc,P+(-l.la-c2)*sc,8,0,7);x.fill()}
 };
 if(s.init)s.init(u);
 let on=false;
 btn.onclick=async()=>{
  if(on){if(stopFn){try{stopFn()}catch(e){}stopFn=null}on=false;running=false;unwake();btn.textContent='Avvia';btn.classList.remove('stop');return}

  catch(e){er.textContent=e.message||String(e);on=false;running=false;unwake();btn.textContent='Avvia';btn.classList.remove('stop')}
 };
